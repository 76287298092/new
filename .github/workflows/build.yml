name: Build PhoneVR APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Remove flatDir and broken AAR
        run: |
          rm -f cardboard/cardboard-sdk.aar
          sed -i "/flatDir {/,/}/d" build.gradle
          sed -i 's/^build\.dependsOn(extractNdk)/\/\/ &/' app/build.gradle
          sed -i 's/^preBuild\.dependsOn("spotlessCheck")/\/\/ &/' app/build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneVR-debug
          path: app/build/outputs/apk/debug/app-debug.apk
